name: Prepare the jhack workspace
description: >
  Overlay the jhack source of a target branch onto the workflow branch checkout
  (kept: the integration tests, .github/), then optionally patch the ops /
  ops-scenario dependency. Expects the workflow branch to be checked out in
  ./workspace already.

inputs:
  target-branch:
    description: Branch of jhack to test (empty means the branch that triggered the workflow).
    required: false
    default: ""
  ops-version:
    description: ops version or specifier, for example 3.9.0 (empty to leave as is).
    required: false
    default: ""
  ops-scenario-version:
    description: ops-scenario (ops[testing]) version or specifier (empty to leave as is).
    required: false
    default: ""
  ops-git-ref:
    description: >
      Git ref ("main", "owner/repo@branch", "canonical/operator@refs/pull/N/head") of the
      operator repo to install ops and ops-scenario from. Empty to leave as is.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout target branch (${{ inputs.target-branch }}) for jhack source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        ref: ${{ inputs.target-branch }}
        path: target-branch
        persist-credentials: false

    # Everything but the integration tests (and the CI plumbing) comes from the target
    # branch: jhack source, pyproject.toml, uv.lock, snapcraft.yaml.
    - name: Overlay jhack source from the target branch
      shell: bash
      run: |
        rsync -a \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='jhack/tests/integration/' \
          target-branch/ \
          workspace/
        echo "target branch: $(git -C target-branch rev-parse --abbrev-ref HEAD) @ $(git -C target-branch rev-parse HEAD)"
        {
          echo "### jhack under test"
          echo
          echo "- target branch: \`$(git -C target-branch rev-parse --abbrev-ref HEAD)\` @ \`$(git -C target-branch rev-parse --short HEAD)\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Patch ops dependencies
      shell: bash
      working-directory: workspace
      run: >
        python3 .github/scripts/patch_ops_deps.py
        --ops-version "$OPS_VERSION"
        --ops-scenario-version "$OPS_SCENARIO_VERSION"
        --ops-git-ref "$OPS_GIT_REF"
      env:
        OPS_VERSION: ${{ inputs.ops-version }}
        OPS_SCENARIO_VERSION: ${{ inputs.ops-scenario-version }}
        OPS_GIT_REF: ${{ inputs.ops-git-ref }}
