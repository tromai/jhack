# Config for the live integration tests, so that they are self-contained: the CI
# workflow swaps in the jhack source (including pyproject.toml) of the branch under
# test and keeps this directory from the workflow branch.
[pytest]
log_cli_format = %(levelname)s %(name)s %(message)s
markers =
    machine: live integration test targets a machine (lxd) substrate.
    k8s: live integration test targets a Canonical Kubernetes substrate.
