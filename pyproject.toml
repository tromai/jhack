[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jhack"
version = "0.4.4.0.33"
requires-python = ">=3.10" # core24 supports up to 3.12 but data platform depends on 3.10
authors = [
    { name = "Pietro Pasotti", email = "pietro.pasotti@canonical.com" }
]
description = "Chock-full of Juju hackery."
license.text = "Apache 2.0"
keywords = ["juju", "hacks", "cli", "charm", "charming"]
urls.Source = "https://github.com/canonical/jhack"
dependencies = [
    "ops[testing](>=3.0.0)",
    "typer(==0.18.0)",
    "black",
    "rich(==13.3.0)",
    "parse(==1.19.0)",
    "urllib3(==1.26.20)",
    "requests(==2.29.0)",
    "requests-unixsocket(==0.3.0)",
    "asttokens",
    "astunparse",
    "toml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Utilities",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage[toml]",
    "black",
    "ruff",
    "pyproject-flake8",
    "pep8-naming",
    "isort",
    "pyright",
]
# The live integration tests' extra dependencies live in
# jhack/tests/integration/requirements.txt.

[tool.pytest.ini_options]
log_cli_format = "%(levelname)s %(name)s %(message)s"
markers = [
    "machine: live integration test targets a machine (lxd) substrate.",
    "k8s: live integration test targets a Canonical Kubernetes substrate.",
]

[project.scripts]
jhack = "jhack.main:main"

[tool.setuptools.package-dir]
jhack = "jhack"

[tool.ruff]
line-length = 99

# Lint rules are enforced in CI for the `jhack scenario snapshot` module only
# (see .github/snapshot-scope.sh for the exact file list).
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # typer.Option(...) in argument defaults is the typer idiom
    "B904",  # raise ... from err: pre-existing, out of scope
    "UP042",  # FormatOption(str, Enum): kept for typer compatibility
]

[tool.pyright]
typeCheckingMode = "standard"
reportMissingImports = true

[tool.black]
include = '\.pyi?$'

[tool.isort]
profile = "black"
